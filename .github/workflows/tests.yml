name: Tests

on:
  pull_request:
  push:
    branches: [main]
  # Homebrew's Python, numpy, scipy and pillow move without any change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Install and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      # In a tap repository this also links the checkout as service-dept/tap.
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - name: Check formula style
        run: brew style service-dept/tap
      - name: Install op-img from source
        run: brew install --build-from-source service-dept/tap/op-img
      - name: Audit formula
        run: brew audit --strict service-dept/tap/op-img
      - name: Test op-img
        run: brew test service-dept/tap/op-img
